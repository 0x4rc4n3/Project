services:
  vault:
    image: hashicorp/vault:latest
    container_name: scatterid-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - scatterid_net

  crypto-service:
    build:
      context: ./components/crypto/crypto-service
      dockerfile: Dockerfile
    container_name: scatterid-crypto
    ports:
      - "5001:5001"
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "dev-root-token"
      CRYPTO_SERVICE_API_KEY: "dev-secret-key-123"
    depends_on:
      - vault
    volumes:
      - ./components/crypto/certs:/app/certs
    networks:
      - scatterid_net

  verification-api:
    build:
      context: ./components/verification-api
      dockerfile: Dockerfile
    container_name: scatterid-verification
    ports:
      - "3000:3000"
    environment:
      CRYPTO_SERVICE_API_KEY: "dev-secret-key-123"
      CRYPTO_SERVICE_URL: "https://crypto-service:5001"
      NODE_EXTRA_CA_CERTS: "/app/certs/ca.crt"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      - crypto-service
    volumes:
      - ./components/crypto/certs:/app/certs
      - ./components/blockchain:/app/blockchain
      - verification_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scatterid_net

  project-dashboard:
    build:
      context: ./components/project-dashboard
      dockerfile: Dockerfile
    container_name: scatterid-dashboard
    ports:
      - "4000:4000"
    environment:
      VERIFICATION_API_URL: "http://verification-api:3000"
    volumes:
      - ./Progress.md:/app/Progress.md
      - ./components/project-dashboard:/app
      - /app/node_modules
      - ./components/verification-api:/app/verification-api
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scatterid_net

  shard-node-1:
    build:
      context: ./components/shard-node
      dockerfile: Dockerfile
    container_name: scatterid-shard-1
    ports:
      - "3001:3000"
    environment:
      NODE_INDEX: "1"
      DATA_DIR: "/app/data"
    volumes:
      - shard_1_data:/app/data
    networks:
      - scatterid_net

  shard-node-2:
    build:
      context: ./components/shard-node
      dockerfile: Dockerfile
    container_name: scatterid-shard-2
    ports:
      - "3002:3000"
    environment:
      NODE_INDEX: "2"
      DATA_DIR: "/app/data"
    volumes:
      - shard_2_data:/app/data
    networks:
      - scatterid_net

  shard-node-3:
    build:
      context: ./components/shard-node
      dockerfile: Dockerfile
    container_name: scatterid-shard-3
    ports:
      - "3003:3000"
    environment:
      NODE_INDEX: "3"
      DATA_DIR: "/app/data"
    volumes:
      - shard_3_data:/app/data
    networks:
      - scatterid_net

  shard-node-4:
    build:
      context: ./components/shard-node
      dockerfile: Dockerfile
    container_name: scatterid-shard-4
    ports:
      - "3004:3000"
    environment:
      NODE_INDEX: "4"
      DATA_DIR: "/app/data"
    volumes:
      - shard_4_data:/app/data
    networks:
      - scatterid_net

  shard-node-5:
    build:
      context: ./components/shard-node
      dockerfile: Dockerfile
    container_name: scatterid-shard-5
    ports:
      - "3005:3000"
    environment:
      NODE_INDEX: "5"
      DATA_DIR: "/app/data"
    volumes:
      - shard_5_data:/app/data
    networks:
      - scatterid_net

networks:
  scatterid_net:
    driver: bridge

volumes:
  verification_data:
  shard_1_data:
  shard_2_data:
  shard_3_data:
  shard_4_data:
  shard_5_data:
